name: NSW Independent Planning Commission Monitor

on:
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsw-ipc-planning-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPC monitor
        env:
          PLANNING_SLACK_WEBHOOK: ${{ secrets.PLANNING_SLACK_WEBHOOK }}
        run: python ipc_monitor.py

      - name: Save updated IPC state
        run: |
          git config user.name "NSW IPC Monitor"
          git config user.email "actions@users.noreply.github.com"

          git add ipc_state.json

          if git diff --cached --quiet; then
            echo "No IPC state change to save."
          else
            git commit -m "Update IPC monitor state"
            git push
          fi
